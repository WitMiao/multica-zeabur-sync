name: Sync Multica release to Zeabur

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Resolve latest GHCR tags per image
        id: tags
        run: |
          get_latest_tag() {
            local image="$1"
            local token
            token=$(curl -fsSL \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:multica-ai/${image}:pull" \
              | jq -r .token)
            curl -fsSL -H "Authorization: Bearer ${token}" \
              "https://ghcr.io/v2/multica-ai/${image}/tags/list?n=100" \
              | jq -r '
                  .tags
                  | map(select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))
                  | sort_by(split(".") | map(sub("^v"; "") | tonumber))
                  | reverse
                  | .[0]
                '
          }

          BACKEND_TAG=$(get_latest_tag multica-backend)
          WEB_TAG=$(get_latest_tag multica-web)

          test -n "$BACKEND_TAG"
          test -n "$WEB_TAG"

          echo "backend_tag=$BACKEND_TAG" >> "$GITHUB_OUTPUT"
          echo "web_tag=$WEB_TAG" >> "$GITHUB_OUTPUT"
          echo "Latest backend image: $BACKEND_TAG"
          echo "Latest web image: $WEB_TAG"

      - name: Login Zeabur
        run: npx zeabur@latest auth login --token "${{ secrets.ZEABUR_TOKEN }}" -i=false

      - name: Update backend image tag
        run: |
          TAG="${{ steps.tags.outputs.backend_tag }}"
          npx zeabur@latest service update tag \
            --id "${{ secrets.ZEABUR_BACKEND_ID }}" -t "$TAG" -y -i=false
          echo "Backend -> $TAG"

      - name: Update frontend image tag
        run: |
          TAG="${{ steps.tags.outputs.web_tag }}"
          npx zeabur@latest service update tag \
            --id "${{ secrets.ZEABUR_FRONTEND_ID }}" -t "$TAG" -y -i=false
          echo "Frontend -> $TAG"
