name: Sync Multica release to Zeabur

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Resolve latest release tag
        id: tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use GitHub Releases as source of truth. GHCR tags/list is paginated
          # (130+ tags) and the old n=100 query missed v0.3.32+ / v0.4.0, causing
          # the sync job to redeploy stale v0.3.29 / v0.3.31 images.
          TAG=$(gh api repos/multica-ai/multica/releases/latest --jq .tag_name)
          test -n "$TAG"
          test "$TAG" != "null"

          echo "backend_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "web_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Latest release tag: $TAG"

      - name: Login Zeabur
        run: npx zeabur@latest auth login --token "${{ secrets.ZEABUR_TOKEN }}" -i=false

      - name: Update backend image tag
        run: |
          TAG="${{ steps.tags.outputs.backend_tag }}"
          npx zeabur@latest service update tag \
            --id "${{ secrets.ZEABUR_BACKEND_ID }}" -t "$TAG" -y -i=false
          echo "Backend -> $TAG"

      - name: Update frontend image tag
        run: |
          TAG="${{ steps.tags.outputs.web_tag }}"
          npx zeabur@latest service update tag \
            --id "${{ secrets.ZEABUR_FRONTEND_ID }}" -t "$TAG" -y -i=false
          echo "Frontend -> $TAG"
